<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rom-Com Royalty — Tier List</title>
<style>
:root{--pink:#ff4fb8;--hot:#ff2f92;--purple:#7c3aed;--deep:#32145f;--ink:#2b1637;--cream:#fff7fc;--card:#fff;--line:#ead7f5}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:
radial-gradient(circle at 10% 0%,#ffd5ef 0 18%,transparent 40%),
radial-gradient(circle at 90% 15%,#dcc8ff 0 16%,transparent 38%),
linear-gradient(135deg,#fff7fc,#f7f0ff);min-height:100vh}
header{padding:54px 24px 28px;text-align:center}
.kicker{font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);font-size:.78rem}
h1{margin:8px auto 10px;font-size:clamp(2.4rem,7vw,5.4rem);line-height:.9;max-width:950px;letter-spacing:-.06em}
h1 span{background:linear-gradient(90deg,var(--hot),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{max-width:720px;margin:auto;color:#725f7c;font-size:1.03rem}
.wrap{width:min(1220px,94vw);margin:auto;padding-bottom:64px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:18px 0;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:1.1rem}
button{border:0;border-radius:999px;padding:11px 16px;font-weight:800;cursor:pointer;background:#fff;box-shadow:0 5px 18px #6e3aa51a;color:var(--purple)}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px;margin-bottom:28px}
.movie{background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 30px #6f3d8d20;cursor:grab;transition:.18s transform,.18s box-shadow;touch-action:none}
.movie:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 18px 34px #6f3d8d30}
.movie.dragging{opacity:.48;transform:scale(.96)}
.poster{height:230px;background:linear-gradient(145deg,#ffb7df,#a98bff);position:relative;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:18px;text-align:center;color:#fff;font-weight:950;font-size:1.25rem;text-shadow:0 2px 12px #4a135b80}
.info{padding:12px 13px 14px}
.title{font-weight:900;line-height:1.08;margin-bottom:7px}
.meta{font-size:.76rem;color:#725f7c;line-height:1.35}
.money{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:999px;background:#fff0f8;color:#c22478;font-size:.72rem;font-weight:900}
.board{border:1px solid #e7d5f2;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px #5d31731a;background:#fff9}
.tier{display:grid;grid-template-columns:82px 1fr;min-height:145px;border-bottom:1px solid var(--line)}
.tier:last-child{border-bottom:0}
.badge{display:grid;place-items:center;font-size:2.1rem;font-weight:1000;color:white;text-shadow:0 2px 8px #0002}
.tier[data-tier="S"] .badge{background:linear-gradient(145deg,#ff2f92,#ff6fba)}
.tier[data-tier="A"] .badge{background:linear-gradient(145deg,#a64dff,#7c3aed)}
.tier[data-tier="B"] .badge{background:linear-gradient(145deg,#7454df,#5940bf)}
.tier[data-tier="C"] .badge{background:linear-gradient(145deg,#b166cc,#874aa1)}
.tier[data-tier="D"] .badge{background:linear-gradient(145deg,#d77cab,#b85e8e)}
.tier[data-tier="F"] .badge{background:linear-gradient(145deg,#78657f,#5b4962)}
.dropzone{padding:13px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;min-width:0}
.dropzone:empty:after{content:"Drop movies here";color:#b7a6bf;font-weight:750;align-self:center;margin-left:10px}
.dropzone.over{background:#faecff;outline:3px dashed #b764df;outline-offset:-6px}
.dropzone .movie{width:165px}
.dropzone .poster{height:205px}
footer{text-align:center;color:#8b7894;font-size:.78rem;margin-top:18px}
@media(max-width:620px){.tier{grid-template-columns:58px 1fr}.badge{font-size:1.55rem}.pool{grid-template-columns:repeat(2,1fr)}.poster{height:215px}.dropzone .movie{width:145px}.dropzone .poster{height:185px}}
.creator{
  margin:28px auto 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:max-content;
  max-width:100%;
  padding:10px 16px;
  border:1px solid #ead7f5;
  border-radius:999px;
  background:rgba(255,255,255,.78);
  box-shadow:0 8px 24px #6f3d8d18;
}

.creator img{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #ffb7df;
}

.creator-text{
  text-align:left;
  line-height:1.25;
}

.creator-text strong{
  display:block;
  color:#5e2879;
  font-size:.88rem;
}

.creator-text span{
  font-size:.72rem;
  color:#8b7894;
}
</style>
</head>
<body>
<header>
  <div class="kicker">25 years of meet-cutes & bad decisions</div>
  <h1>Rom-Com <span>Royalty</span></h1>
  <p class="sub">Drag every movie into a tier from S to F. Rankings are yours; the pink-and-purple judgment is final.</p>
</header>
<main class="wrap">
  <div class="toolbar"><h2>💘 Unranked movies</h2><button id="reset">Reset ranking</button></div>
  <section class="pool dropzone" id="pool"></section>
  <section class="board" aria-label="Rom-com tier list">
    <div class="tier" data-tier="S"><div class="badge">S</div><div class="dropzone"></div></div>
    <div class="tier" data-tier="A"><div class="badge">A</div><div class="dropzone"></div></div>
    <div class="tier" data-tier="B"><div class="badge">B</div><div class="dropzone"></div></div>
    <div class="tier" data-tier="C"><div class="badge">C</div><div class="dropzone"></div></div>
    <div class="tier" data-tier="D"><div class="badge">D</div><div class="dropzone"></div></div>
    <div class="tier" data-tier="F"><div class="badge">F</div><div class="dropzone"></div></div>
  </section>
  <footer>
  <!-- <div>
    Box office figures shown are approximate worldwide theatrical grosses.
    Your ranking is saved locally in this browser.
  </div> -->

  <div class="creator">
    <img src="IMG_5525.jpg" alt="Isabella Canelos">

    <div class="creator-text">
      <strong>Created by Isabella Canelos</strong>
      <span>Rom-Com Royalty Tier List</span>
    </div>
  </div>
</footer>
</main>
<script>
const movies=[
["Bridget Jones's Diary",2001,"Renée Zellweger · Colin Firth","$282M","https://www.impawards.com/2001/posters/bridget_jones_diary.jpg"],
["My Big Fat Greek Wedding",2002,"Nia Vardalos · John Corbett","$369M","https://www.impawards.com/2002/posters/my_big_fat_greek_wedding.jpg"],
["How to Lose a Guy in 10 Days",2003,"Kate Hudson · Matthew McConaughey","$178M","https://www.impawards.com/2003/posters/how_to_lose_a_guy_in_ten_days.jpg"],
["13 Going on 30",2004,"Jennifer Garner · Mark Ruffalo","$96M","https://www.impawards.com/2004/posters/thirteen_going_on_thirty.jpg"],
["Hitch",2005,"Will Smith · Eva Mendes","$372M","https://www.impawards.com/2005/posters/hitch.jpg"],
["The Holiday",2006,"Cameron Diaz · Kate Winslet","$205M","https://www.impawards.com/2006/posters/holiday.jpg"],
["27 Dresses",2008,"Katherine Heigl · James Marsden","$162M","https://www.impawards.com/2008/posters/twenty_seven_dresses.jpg"],
["The Proposal",2009,"Sandra Bullock · Ryan Reynolds","$317M","https://www.impawards.com/2009/posters/proposal.jpg"],
["Crazy, Stupid, Love.",2011,"Steve Carell · Ryan Gosling · Emma Stone","$145M","https://www.impawards.com/2011/posters/crazy_stupid_love.jpg"],
["About Time",2013,"Domhnall Gleeson · Rachel McAdams","$88M","https://www.impawards.com/2013/posters/about_time.jpg"],
["Crazy Rich Asians",2018,"Constance Wu · Henry Golding","$239M","https://www.impawards.com/2018/posters/crazy_rich_asians.jpg"],
["Anyone But You",2023,"Sydney Sweeney · Glen Powell","$220M","https://www.impawards.com/2023/posters/anyone_but_you.jpg"]
];
const pool=document.querySelector("#pool"), zones=[...document.querySelectorAll(".dropzone")];
function card(m,i){
 const el=document.createElement("article"); el.className="movie"; el.draggable=true; el.dataset.id=i;
 el.innerHTML=`<div class="poster"><div class="fallback">${m[0]}</div><img src="${m[4]}" alt="${m[0]} movie poster" onerror="this.style.display='none'"></div>
 <div class="info"><div class="title">${m[0]}</div><div class="meta">${m[1]}<br>${m[2]}</div><span class="money">Worldwide · ${m[3]}</span></div>`;
 el.addEventListener("dragstart",()=>el.classList.add("dragging"));
 el.addEventListener("dragend",()=>{el.classList.remove("dragging");save()});
 return el;
}
movies.forEach((m,i)=>pool.appendChild(card(m,i)));
zones.forEach(z=>{
 z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over")});
 z.addEventListener("dragleave",()=>z.classList.remove("over"));
 z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("over");const d=document.querySelector(".dragging");if(d)z.appendChild(d);save()});
});
function save(){
 const state={};
 document.querySelectorAll(".tier").forEach(t=>state[t.dataset.tier]=[...t.querySelectorAll(".movie")].map(x=>x.dataset.id));
 state.pool=[...pool.querySelectorAll(".movie")].map(x=>x.dataset.id);
 localStorage.setItem("romcom-tier",JSON.stringify(state));
}
function load(){
 try{const s=JSON.parse(localStorage.getItem("romcom-tier")); if(!s)return;
  (s.pool||[]).forEach(id=>{const e=document.querySelector(`[data-id="${id}"]`);if(e)pool.appendChild(e)});
  document.querySelectorAll(".tier").forEach(t=>(s[t.dataset.tier]||[]).forEach(id=>{const e=document.querySelector(`[data-id="${id}"]`);if(e)t.querySelector(".dropzone").appendChild(e)}));
 }catch(e){}
}
document.querySelector("#reset").onclick=()=>{movies.forEach((_,i)=>pool.appendChild(document.querySelector(`[data-id="${i}"]`)));localStorage.removeItem("romcom-tier")};
load();
</script>
</body>
</html>
